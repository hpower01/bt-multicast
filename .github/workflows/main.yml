name: Build Bluetooth A2DP multicast

on:
  workflow_dispatch:
    inputs:
      aosp_branch:
        description: "AOSP tag matching the phone. M305 (TP1A.220624.014, patch 2023-04-05) = android-security-13.0.0_r6"
        required: true
        default: "android-security-13.0.0_r6"
      mode:
        description: "lib = only libbluetooth_jni.so (faster), apex = whole com.android.btservices"
        required: true
        default: "lib"
        type: choice
        options:
          - lib
          - apex

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Maximize disk space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 6144
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Install build packages (and fix Entropy)
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 python-is-python3 zip unzip \
            rsync libncurses5 fontconfig xsltproc libxml2-utils haveged
          sudo systemctl start haveged
          
          mkdir -p ~/bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"
          git config --global color.ui false
          
          cat > ~/bin/monitor <<'EOF'
          #!/bin/bash
          while sleep 60; do
            echo "[monitor] build disk free: $(df -h --output=avail "$GITHUB_WORKSPACE" | tail -1)" \
                 "| root free: $(df -h --output=avail / | tail -1)" \
                 "| $(free -m | awk '/Mem/{print "RAM used " $3 "/" $2 " MB"}')" \
                 "| $(free -m | awk '/Swap/{print "swap used " $3 "/" $2 " MB"}')"
          done
          EOF
          chmod +x ~/bin/monitor

      - name: Download AOSP source (${{ inputs.aosp_branch }})
        run: |
          monitor & MON=$!
          mkdir -p aosp && cd aosp
          
          # נסיון חוזר לאתחול מול השרתים של גוגל במקרה של שגיאת 503
          for i in 1 2 3; do
            repo init -u https://android.googlesource.com/platform/manifest \
              -b "${{ inputs.aosp_branch }}" --depth=1 \
              -g default,-device,-darwin,-mips,-notdefault && break
            echo "repo init failed, retrying in 10s..."
            sleep 10
          done

          mkdir -p .repo/local_manifests
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<manifest>'
            for p in \
              platform/cts platform/test/cts-root \
              platform/developers/build platform/developers/demos platform/developers/samples/android \
              platform/external/chromium-webview \
              platform/prebuilts/abi-dumps/ndk platform/prebuilts/abi-dumps/platform platform/prebuilts/abi-dumps/vndk \
              platform/prebuilts/android-emulator platform/prebuilts/qemu-kernel \
              platform/prebuilts/gcc/linux-x86/host/x86_64-w64-mingw32-4.8 \
              platform/prebuilts/jdk/jdk8 platform/prebuilts/jdk/jdk9 \
              platform/prebuilts/gradle-plugin platform/prebuilts/maven_repo/android platform/prebuilts/maven_repo/bumptech \
              platform/prebuilts/devtools platform/prebuilts/asuite platform/prebuilts/bundletool \
              platform/prebuilts/checkcolor platform/prebuilts/ktlint platform/prebuilts/remoteexecution-client
            do
              if grep -q "name=\"$p\"" .repo/manifests/default.xml; then
                echo "  <remove-project name=\"$p\" />"
              fi
            done
            echo '</manifest>'
          } > .repo/local_manifests/remove.xml

          # נסיון חוזר להורדה (ללא fail-fast) כדי לעקוף ניתוקים מהשרת של גוגל
          for i in 1 2 3 4 5; do
            repo sync -c -j4 --no-tags --no-clone-bundle --optimized-fetch \
              --force-sync -q && break
            echo "repo sync failed (Google server 503?), retrying in 30s..."
            sleep 30
          done
          
          kill $MON

      - name: Apply multicast patch
        run: |
          cd aosp/packages/modules/Bluetooth
          git apply --verbose "$GITHUB_WORKSPACE/repo/a2dp_multicast.patch"
          
      - name: Free git objects
        run: |
          cd aosp
          rm -rf .repo/project-objects .repo/projects

      - name: Build
        run: |
          monitor &
          echo 1000 > /proc/self/oom_score_adj || true
          
          export BUILD_BROKEN_DISABLE_BAZEL=true
          export SKIP_SOONG_TESTS=true
          
          cd aosp
          export ALLOW_MISSING_DEPENDENCIES=true
          
          set +e
          source build/envsetup.sh
          banchan com.android.btservices arm64 userdebug || exit 1
          set -e
          
          echo "Starting the build process..."
          # מריצים עם -j4 כי הזיכרון שלך עמד יפה מאוד בעומס בריצה הקודמת
          if [ "${{ inputs.mode }}" = "apex" ]; then
            m -j4 --skip-soong-tests apps_only dist
          else
            m -j4 --skip-soong-tests libbluetooth_jni
          fi

      - name: Package Magisk module
        run: |
          set -e
          cd aosp
          OUT_DIR="$GITHUB_WORKSPACE/out_artifacts"
          MOD="$OUT_DIR/module"
          mkdir -p "$MOD"

          cat > "$MOD/module.prop" <<'EOF'
          id=a2dp_multicast
          name=Bluetooth A2DP Multicast
          version=1
          versionCode=1
          author=local
          description=Stream Bluetooth audio to several A2DP devices at once (AOSP patch)
          EOF

          cat > "$MOD/system.prop" <<'EOF'
          persist.bluetooth.maxconnectedaudiodevices=2
          persist.bluetooth.a2dp_multicast.enabled=true
          EOF

          if [ "${{ inputs.mode }}" = "apex" ]; then
            APEX=$(find out/dist out/soong/.intermediates/packages/modules/Bluetooth/apex \
                     -name com.android.btservices.apex -not -path '*unsigned*' 2>/dev/null | head -n1)
            echo "apex: $APEX"
            [ -n "$APEX" ]
            
            mkdir -p "$MOD/system/apex"
            cp "$APEX" "$MOD/system/apex/com.android.btservices.apex"
            cp "$APEX" "$OUT_DIR/"
          else
            BASE="out/soong/.intermediates/packages/modules/Bluetooth"
            LIB=$(find "$BASE" -path '*/libbluetooth_jni/*arm64*apex*' -name libbluetooth_jni.so -not -path '*unstripped*' 2>/dev/null | head -n1)
            [ -n "$LIB" ] || LIB=$(find "$BASE" -path '*/libbluetooth_jni/*arm64*' -name libbluetooth_jni.so -not -path '*unstripped*' 2>/dev/null | head -n1)
            echo "lib: $LIB"
            echo "all libbluetooth_jni.so built:"; find "$BASE" -name libbluetooth_jni.so 2>/dev/null
            [ -n "$LIB" ]
            
            mkdir -p "$MOD/bt"
            cp "$LIB" "$MOD/bt/libbluetooth_jni.so"
            cp "$LIB" "$OUT_DIR/"

            cat > "$MOD/service.sh" <<'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          NEW="$MODDIR/bt/libbluetooth_jni.so"
          for TARGET in /apex/com.android.btservices/lib64/libbluetooth_jni.so; do
            i=0
            until [ -f "$TARGET" ] || [ $i -ge 60 ]; do sleep 1; i=$((i+1)); done
            [ -f "$TARGET" ] || continue
            CTX=$(ls -Z "$TARGET" | awk '{print $1}')
            chmod 644 "$NEW"
            chcon "$CTX" "$NEW"
            mount -o bind "$NEW" "$TARGET"
          done
          killall com.android.bluetooth 2>/dev/null || pkill -f com.android.bluetooth
          EOF
            chmod 755 "$MOD/service.sh"
          fi

          (cd "$MOD" && zip -qr "$OUT_DIR/a2dp_multicast_magisk.zip" .)

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: a2dp-multicast-${{ inputs.mode }}-${{ inputs.aosp_branch }}
          path: |
            out_artifacts/*.zip
            out_artifacts/*.so
            out_artifacts/*.apex
          if-no-files-found: error
